<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Burnt-area rendering check</title>
        <link rel="stylesheet" href="/node_modules/leaflet/dist/leaflet.css" />
        <style>
            body {
                font: 16px system-ui;
                margin: 24px;
            }
            #map {
                height: 520px;
                width: 700px;
                max-width: 100%;
            }
            pre {
                white-space: pre-wrap;
            }
        </style>
    </head>
    <body>
        <h1>Burnt-area rendering check</h1>
        <p>Live GWIS polygons near 75.655° E, 30.620° N. Display test only.</p>
        <div id="map"></div>
        <pre id="result">Loading…</pre>
        <script type="module">
            import * as L from '/node_modules/leaflet/dist/leaflet-src.esm.js';
            import { createBurntAreaLayer } from '/src/lib/utils/burntAreaLayer.js';
            const boundary = await (await fetch('/boundaries/PB.geojson')).json();
            const map = L.map('map').setView([30.61953125, 75.65546875], 13);
            map.createPane('burntArea');
            map.getPane('burntArea').style.zIndex = 430;
            L.tileLayer(
                'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                { maxZoom: 19 },
            ).addTo(map);
            const layer = createBurntAreaLayer(L, boundary, '2026-09-15/2026-11-16').addTo(map);
            layer.on('load', () => {
                let painted = 0,
                    tiles = 0;
                for (const canvas of document.querySelectorAll('.leaflet-burntArea-pane canvas')) {
                    const data = canvas.getContext('2d').getImageData(0, 0, 256, 256).data;
                    tiles++;
                    for (let i = 3; i < data.length; i += 4) if (data[i]) painted++;
                }
                document.getElementById('result').textContent = JSON.stringify(
                    { tiles, painted, passed: painted > 0 },
                    null,
                    2,
                );
            });
            layer.on(
                'tileerror',
                () => (document.getElementById('result').textContent = 'FAIL: source tile error'),
            );
        </script>
    </body>
</html>
